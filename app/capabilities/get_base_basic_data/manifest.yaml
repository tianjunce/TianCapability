name: get_base_basic_data
kind: tool
description: 按当前登录用户可见基地查询核心信息；天气和生育期历史按基地设备绑定履历解析

method: POST
path: /capabilities/get_base_basic_data
timeout_seconds: 30
supports_progress: true

input_schema:
  type: object
  additionalProperties: false
  properties:
    action:
      type: string
      enum:
        - overview
    area_id:
      oneOf:
        - type: string
          minLength: 1
        - type: integer
    area_name:
      type: string
      minLength: 1
    start_date:
      type: string
      minLength: 1
    end_date:
      type: string
      minLength: 1
  required:
    - action

output_schema:
  type: object
  additionalProperties: false
  properties:
    selected_area_id:
      type: string
    selected_area_name:
      type: string
    date_range_start:
      type: string
    date_range_end:
      type: string
    query_mode:
      type: string
      enum:
        - area
    device_refs:
      type: object
      additionalProperties: true
    time_axes:
      type: object
      additionalProperties: true
    met_overview:
      type: object
      additionalProperties: true
    insect_overview:
      type: object
      additionalProperties: true
    rice_stage_overview:
      type: object
      additionalProperties: true
    suggest_overview:
      type: object
      additionalProperties: true
    module_statuses:
      type: object
      additionalProperties: false
      properties:
        weather:
          type: string
        rice_stage:
          type: string
        rice_stage_preset:
          type: string
    warnings:
      type: array
      items:
        type: string


